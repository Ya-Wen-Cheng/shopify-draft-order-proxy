name: Test

# Run the Vitest suite on every PR and on pushes to main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Same check that guards `npm run deploy`; no Cloudflare credentials needed.
      - run: npx vitest run
